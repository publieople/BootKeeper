name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Set version from git tag
        shell: bash
        working-directory: .
        env:
          VER: ${{ github.ref_name }}
        run: |
          # strip leading 'v' (v0.1.1 -> 0.1.1)
          VER="${VER#v}"
          echo "injecting version $VER"
          export VER
          python3 -c "
          import os, re, json
          v = os.environ['VER']
          c = open('Cargo.toml').read()
          c = re.sub(r'(?m)^version\s*=\s*\"[^\"]+\"', f'version = \"{v}\"', c, count=1)
          open('Cargo.toml', 'w').write(c)
          d = json.load(open('gui/src-tauri/tauri.conf.json'))
          d['version'] = v
          open('gui/src-tauri/tauri.conf.json', 'w').write(json.dumps(d, indent=2, ensure_ascii=False) + '\n')
          print(f'version injected: {v}')
          "
        # tauri.conf beforeBuildCommand already does: pnpm build && cargo build ...
      - run: pnpm tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootkeeper-installer
          path: |
            gui/src-tauri/target/release/bundle/nsis/*.exe
            gui/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: bootkeeper-installer
          path: installer
      - name: List downloaded files
        run: find installer -type f
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          FILES=$(find installer -type f \( -name "*.exe" -o -name "*.msi" \) | tr '\n' ' ')
          echo "uploading: $FILES"
          gh release create "$TAG" $FILES \
            --title "BootKeeper $TAG" \
            --notes "BootKeeper $TAG release — Windows installer (NSIS) + MSI."
