name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # tauri.conf beforeBuildCommand builds CLI+helper and prepares resources
      - run: pnpm tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootkeeper-installer
          # flatten: upload from within the bundle dirs so download is flat
          path: |
            gui/src-tauri/target/release/bundle/nsis/*.exe
            gui/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bootkeeper-installer
          path: installer
      - name: List downloaded files
        run: find installer -type f
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          # Collect every exe/msi anywhere under installer/
          FILES=$(find installer -type f \( -name "*.exe" -o -name "*.msi" \) | tr '\n' ' ')
          echo "uploading: $FILES"
          gh release create "$TAG" $FILES \
            --title "BootKeeper $TAG" \
            --notes "BootKeeper $TAG release — Windows installer (NSIS) + MSI."
