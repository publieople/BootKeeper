name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # tauri.conf beforeBuildCommand builds CLI+helper and prepares resources
      - run: pnpm tauri build
      # Upload both the installer and the raw bundles
      - name: Upload installer (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: bootkeeper-installer
          path: |
            gui/src-tauri/target/release/bundle/nsis/*.exe
            gui/src-tauri/target/release/bundle/msi/*.msi
      - name: Upload portable binary
        uses: actions/upload-artifact@v4
        with:
          name: bootkeeper-portable
          path: gui/src-tauri/target/release/bundle/nsis/*.exe

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            artifacts/*/*.exe artifacts/*/*.msi \
            --title "BootKeeper $TAG" \
            --notes "BootKeeper $TAG release — Windows installer + portable binary." || true
