[workspace]
resolver = "2"
members = [
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/publieople/BootKeeper"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_System_TaskScheduler",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_Foundation",
] }

[profile.release]
strip = true
lto = true
